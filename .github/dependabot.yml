version: 2

# Updates are opened against `dev`; they reach `main` with the next dev -> main PR.
# Dependabot reads this file from the default branch, so changes here only apply once merged to main.
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      # Minor and patch updates of runtime dependencies arrive in a single PR;
      # major updates still get their own PR so they can be reviewed separately.
      production-minor-and-patch:
        dependency-type: production
        update-types: [minor, patch]
      dev-dependencies:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ['*']
